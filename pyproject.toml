[build-system]
# >=77: first line that supports PEP 639 `license` as an SPDX expression
# string (the old `license = { text = ... }` table is deprecated and will be
# removed by 2027-Feb).
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "xssentinel"
# Single source of truth is xssentinel/__init__.py; setuptools resolves the
# attr statically (plain literal assignment), so building never imports the
# package (and never pulls its dependencies).
dynamic = ["version"]
description = "Comprehensive, multi-layer XSS detection framework (reflected + context-aware + WAF-evasion + DOM taint + optional headless confirmation)"
readme = "README.md"
# PEP 639 SPDX expression; the matching `License ::` classifier is removed
# (deprecated in the same PEP).
license = "MIT"
authors = [{ name = "XSSentinel authors and contributors" }]
keywords = ["xss", "security", "scanner", "dast", "web-security", "vulnerability-scanner"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
requires-python = ">=3.10"
# Floors are the lowest releases that carry the 2026 advisory fixes measured
# in docs/DEPENDENCY_AUDIT.md; the fixed releases themselves require >=3.10,
# which is why the Python floor moved with them.
dependencies = [
    "requests>=2.33.0",
    "beautifulsoup4>=4.11",
    "lxml>=4.9",
    "soupsieve>=2.9.0",
    "urllib3>=2.8.0",
]

[project.urls]
Homepage = "https://github.com/feixingxuerong123/xssentinel"
Repository = "https://github.com/feixingxuerong123/xssentinel"
Issues = "https://github.com/feixingxuerong123/xssentinel/issues"
Changelog = "https://github.com/feixingxuerong123/xssentinel/blob/main/CHANGELOG.md"

[project.optional-dependencies]
async = ["aiohttp>=3.14.4"]
headless = ["playwright>=1.40"]
api = ["flask>=3.1.3", "werkzeug>=3.1.9"]
ast = ["esprima>=4.0"]  # Phase 43: JS AST data-flow channel (regex fallback when absent)
nuclei = ["pyyaml>=6.0"]  # Phase 322: --nuclei-dast template bridge (clear NucleiImportError when absent)
# The desktop console works with ZERO extra dependencies: the page is served
# by the stdlib API server and the window falls back tkinter -> OS browser.
# This extra only upgrades the window to a native one backed by the OS
# webview (Edge WebView2 on Windows, already present on any supported box).
desktop = ["pywebview>=4.0"]
# --mitm-ca HTTPS interception (core/mitm_ca.py signs the per-host leaf certs).
# Without it the passive proxy still works -- HTTPS stays a blind CONNECT
# tunnel (cli_commands.py prints the install hint).  core/mitm_ca.available()
# probes it lazily, so nothing else imports it.
mitm = ["cryptography>=41"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21",
    # CI passes --timeout=120 and [tool.pytest.ini_options] sets
    # reruns/reruns_delay below; without these two plugins both of those
    # safety nets are silently unavailable (pytest ignores unknown ini keys).
    "pytest-timeout>=2.1",
    "pytest-rerunfailures>=12.0",
    # tests/test_no_undefined_names.py gates on pyflakes reporting zero
    # "undefined name" findings.  Without pyflakes that test silently
    # skips, and the NameError-landmine family it locks comes right back.
    "pyflakes>=3.0",
    # Lint gate: ruff is a hard CI step (see .github/workflows/ci.yml).
    # The baseline is ZERO -- any new finding fails the build.
    "ruff>=0.6",
    # tests/test_passive_mitm*.py need the TLS toolchain to build their
    # self-signed origins (guarded with skipif, not error).  CI installs
    # this by hand today (ci.yml: "pip install cryptography playwright");
    # with it in dev the manual line is redundant but harmless.
    "cryptography>=41",
]

[project.scripts]
xssentinel = "xssentinel.__main__:main"
xssentinel-desktop = "xssentinel.desktop.app:main"

[tool.setuptools]
packages = ["xssentinel", "xssentinel.core", "xssentinel.core.layers", "xssentinel.api", "xssentinel.desktop"]

[tool.setuptools.dynamic]
# Where the dynamic version above resolves from.  A plain literal assignment
# means setuptools reads it via AST -- the package (and its deps) is never
# imported at build time.
version = { attr = "xssentinel.__version__" }

[tool.setuptools.package-data]
xssentinel = ["data/*.json", "desktop/ui/*.html"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
# Phase 43: this host's security software intermittently throttles loopback
# TCP mid-session; one automatic re-run absorbs those flaky failures (real
# regressions still fail twice in a row).
reruns = 1
reruns_delay = 2
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "error::UserWarning",
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
# E = pycodestyle errors, F = pyflakes (unused imports, undefined names,
# unused variables), W = pycodestyle warnings.  The baseline is zero;
# any new finding fails CI.  Intentional deviations must carry a
# `# noqa: <rule>` comment with a reason, not a per-file-ignores entry.
select = ["E", "F", "W"]
# E501 (line length) is deliberately off: payload corpora and report
# templates carry long HTML/JS strings by nature, and wrapping them adds
# churn without safety value.  Everything else in E/W/F is enforced.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Empty by design.  The scanner Mixin imports that used to live here are
# now annotated with inline `# noqa: F401` comments (with reasons) at the
# import site, which is greppable and reviewable; a global exemption table
# would silently absorb future genuine unused imports in the same files.
