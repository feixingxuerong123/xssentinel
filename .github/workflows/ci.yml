name: CI

# XSSentinel quality gate (Phase 42 / P2-10):
#   1. unit + integration pytest (includes the pipeline slice over
#      Attack Range #2 -- main-flow regressions fail here)
#   2. accuracy benchmark -- the push job runs the stratified quick slice
#      (benchmark.runner --quick = 64 of 194 cases, one per
#      (ground_truth, context) pair, so EVERY context family is measured on
#      every push) on BOTH engines, under --strict-gate (FP0/FN0/ERROR0).
#      The slice rotates its representative per ISO week (--quick-offset):
#      builds inside one week are byte-identical slices and therefore
#      comparable, while the window moves, so the 130 cases a fixed slice
#      never touched get measured within 49 weeks instead of never.
#      The full 194-case matrix lives in the
#      separate benchmark-full job (nightly + workflow_dispatch only, ~15 min
#      of pure scanning).  The legacy FPR<=20%/recall>=50% thresholds stay as
#      the default outside --strict-gate, but on a slice this size they
#      tolerated a false positive and two misses per push without turning red.
#   3. accuracy drill on Range #2 (15 vuln + 5 safe, 100%/100% required)
# 4. nightly: the FULL file-by-file gate (tests/run_all_batched.py -- every
#    test_*.py discovered at runtime, with per-file timeout and retry; the file
#    count is deliberately not frozen here, it grows) + the full 194-case matrix on
#    both engines -- installed from the same extra set as requirements.txt, so
#    a wedge or a per-file regression cannot hide behind the 64-case quick
#    slice, and an esprima/flask-gated test cannot silently self-skip.
#    That full gate runs exactly ONCE per run: `tests` owns it on
#    push / pull_request (60-min ceiling), `nightly-gate` owns it on
#    schedule / workflow_dispatch (150-min ceiling).  Before 2026-11-04 both
#    jobs invoked the identical `run_all_batched.py --quiet` on the same
#    scheduled run -- measured in CI #18 (41424021886): tests 45m36s plus
#    nightly-gate 29m38s inside one 45m40s wall-clock run.  The complementary
#    conditions are pinned by tests/test_ci_no_duplicate_gate.py.
# Async/asyncio.run tests self-skip via tests/conftest.py when the runner's
# loopback socketpair is throttled.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  schedule:
    # 02:30 UTC nightly -- the full gate is too slow for every push.
    - cron: "30 2 * * *"

jobs:
  tests:
    runs-on: ubuntu-latest
    # 40 -> 60: the push accuracy step now scores both engines over the 64-case
    # slice (~2 x 6 min on the slowest host we gate on, a degraded-loopback
    # Windows box), which pushed the job past its old ceiling.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install (full suite)
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        # The test suite exercises every engine channel: aiohttp (async),
        # cryptography (MITM), esprima (sandbox JS gate), playwright
        # (browser-confirmed DOM), flask/werkzeug (API gate) and pyyaml
        # (nuclei dast bridge).  Installing less made those files
        # self-skip in the very job that claims to run the suite -- the
        # same lesson the nightly job recorded.  The skip counts stay in
        # the gate output, so this list is checked, not assumed.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,async,ast,api,nuclei]"
          pip install cryptography playwright
          python -m playwright install chromium --with-deps

      - name: Install (lint only)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        # 2026-11-04: on these two events the full gate belongs to
        # `nightly-gate`, so this job runs ONLY the ruff step.  Measured in
        # CI #29 (41820071633): Install took 50s of a 56s job just to lint.
        # Keep ruff from the SAME `dev` extra as the full install (no second
        # copy of the version constraint) but skip chromium and the engine
        # extras that nothing in this job will import.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Lint gate: E/F/W baseline is ZERO.  Fail fast before any test runs
      # so regressions (new unused imports, undefined names, dead code)
      # are caught before they eat CI minutes.
      - name: Lint (ruff E/F/W -- zero baseline)
        run: python -m ruff check

      - name: Unit + integration tests (pipeline slice included)
        # 2026-11-04: on schedule / workflow_dispatch the full file-by-file
        # gate belongs to `nightly-gate` (150-min ceiling).  Running it in
        # both jobs used to execute the identical `run_all_batched.py --quiet`
        # twice in one run (CI #18: 45m36s + 29m38s).  ruff above stays on
        # every trigger; this 60-min ceiling now only covers push / PR.
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        # File-by-file batched runner (per-file subprocess, 540s budget +
        # one retry; exit code = files still red).  A single-process
        # `pytest tests/` wedges the whole suite once one async/DOM test
        # binds the thread to an asyncio loop -- every later sync-Playwright
        # call then dies with "Sync API inside the asyncio loop" and the
        # browser tests degrade to zero findings (measured on the first
        # hosted run, 2026-10-28; tests/run_all_batched.py exists for
        # exactly this).  test_benchmark.py runs since its 192-era wedge
        # was root-caused, so the old --ignore is gone too.
        run: python tests/run_all_batched.py --quiet

      # Evidence must survive the run: a red gate whose per-file pytest log
      # died with the runner forces a full re-run just to read one error.
      # (2026-10-29: the first batched run failed on one file and the log
      # was gone -- the failure had to be reproduced locally from scratch.)
      - name: Upload failure evidence
        # Same event scope as the gate step above: on schedule/dispatch the
        # failure evidence belongs to nightly-gate, which uploads an artifact
        # with the SAME name.  Scoping this avoids two jobs racing for
        # `regression-logs` in one run.
        if: failure() && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: regression-logs
          path: benchmark/results/regression_logs/
          if-no-files-found: ignore

  drills:
    # Accuracy benchmark + range2..6 drills, separate from `tests` so the
    # two halves get their own ceilings.  Measured 2026-10-29 on a hosted
    # runner: the suite alone takes ~45 min and the drills ~18 min more,
    # which cancelled the 60-min `tests` job mid-benchmark after the suite
    # had already passed.  The jobs run in parallel, so the wall clock is
    # the slower half instead of the sum, and a wedged test file can no
    # longer starve the security drills.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        # Same dependency surface as the tests job: the 64-case slice
        # includes DOM families (playwright/chromium) and the ranges ship
        # their own vendored JS, so nothing here may self-skip.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,async,ast,api,nuclei]"
          pip install cryptography playwright
          python -m playwright install chromium --with-deps

      - name: Slice rotation (which member of each family this week measures)
        id: slice
        # The fixed slice scored the same 64 of 194 cases on every push, so
        # after hundreds of rounds those 64 were the only ones a push ever
        # measured; the other 130 waited for the nightly full run, and a
        # regression there cost up to a day to notice.
        #
        # Rotating the representative per ISO week keeps every build inside one
        # week comparable -- that is what makes a red/green diff mean something
        # -- while the window moves.  49 rotations cover the whole matrix
        # (largest family: vulnerable/html_element, 49 cases), so a year of
        # pushes measures everything, instead of the same 64 forever.
        # `tests/test_quick_gate_slice.py` locks both numbers against the
        # manifest, so this constant cannot rot silently.
        #
        # `10#` forces base 10: `date +%V` yields "08" in week 8, and bash
        # would read a bare 08 as an invalid octal literal.
        run: echo "offset=$(( 10#$(date -u +%V) % 49 ))" >> "$GITHUB_OUTPUT"

      - name: Accuracy benchmark (64-case stratified slice, both engines, zero-error gate)
        # --strict-gate: FP0/FN0/ERROR0, because a gate that tolerates an FP or
        # an FN cannot see a broken layer.  The async arm runs here for the same
        # reason: every "async forgot a sync fix" regression on record (concat
        # retry, content-type downgrade, JSONP gadget) was invisible to a
        # push job that only ever scored sync.
        #
        # --quick-offset comes from the step above: same-week builds are
        # byte-identical slices, different weeks measure different members of
        # each family.  Reproduce a CI run locally by passing the same offset.
        run: |
          python -m benchmark.runner --quick --quick-offset ${{ steps.slice.outputs.offset }} --engine sync --strict-gate
          python -m benchmark.runner --quick --quick-offset ${{ steps.slice.outputs.offset }} --engine async --strict-gate

      - name: "Range #2 accuracy drill (must be 100% / 100%)"
        run: python tests/run_range2.py

      # Range #3: an APPLICATION, not a fixture matrix -- SQLite state, a
      # real login session, mixed content types, base64/JWT carriers.  The
      # gate semantics match range4/5/6 (FN/FP/ERROR => exit 1); the two
      # cases the manifest declares sync-only score SKIP, which is recorded
      # in the JSON but does not fail the job.  Until this step existed the
      # runner returned 0 unconditionally, so the range most likely to rot
      # (state, sessions, carriers) was the one no push ever ran.
      - name: "Range #3 application drill (sessions + state + carriers, 100%/100% required)"
        run: python range3/runner.py --engine both --timeout 120 --out range3/results_ci.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: range3-results
          path: range3/results_ci.json
          if-no-files-found: ignore

      # Range #4: real React 18 / Vue 3 bundles (vendored), client-side
      # sinks only -- the framework escapes or it does not.  Ground truth
      # is authored from framework semantics, and the -safe twins are
      # proven first by dev/_r4_construct_probe.py (no browser): the
      # attacker string must not appear in server HTML at all.
      - name: "Range #4 SPA drill (real framework sinks, 100%/100% required)"
        run: python range4/runner.py --engine both --out range4/results_ci.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: range4-results
          path: range4/results_ci.json
          if-no-files-found: ignore

      # Range #5: the Lit range.  The param never touches server-side bytes
      # (static shells -- construct validity by construction, pinned by
      # tests/test_range5.py); the unsafeHTML directive is Lit's analogue
      # of dangerouslySetInnerHTML / v-html.  Same gate standard as range4.
      - name: "Range #5 Lit drill (unsafeHTML vs text interpolation, 100%/100% required)"
        run: python range5/runner.py --engine both --out range5/results_ci.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: range5-results
          path: range5/results_ci.json
          if-no-files-found: ignore

      # Range #6: a real sanitizer pair (DOMPurify 2.0.7 vs 3.4.17).  The
      # positive must keep browser-executed DOM evidence; the safe twin must
      # stay at low delivery evidence only.  This was RED for several phases
      # and is now a push gate (Phase 265).
      - name: "Range #6 sanitizer drill (safe twin must stay low-only)"
        run: python range6/runner.py --engine both --out range6/results_ci.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: range6-results
          path: range6/results_ci.json
          if-no-files-found: ignore

  min-python:
    # The declared floor is 3.10 (Phase 328d; 3.9 cannot install the fixed
    # dependency releases).  Exercise install + transport/MCP/API there so
    # "supports 3.10" is tested, not inferred from the 3.11 job.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,async,ast,api]"
      - name: Floor smoke (CLI + transport + MCP + API gate + sitemap)
        run: |
          python -m xssentinel --help
          pytest tests/test_egress_guard.py tests/test_mcp_server.py \
            tests/test_phase196_api_gate.py \
            tests/test_phase328_mcp_trust_parity.py \
            tests/test_phase328b_sitemap_entities.py \
            tests/test_sitemap_input.py -q --timeout=240

  benchmark-full:
    # Full 194-case drill on demand (slower, ~15 min of pure scanning).
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          # Same extra set as requirements.txt (-e .[dev,async,ast,api]): the
          # AST channel (esprima) is part of the judgment layer, so a matrix
          # calibrated without it is not the same measurement the local gate
          # reports.
          pip install -e ".[dev,async,ast]"
      - name: Full benchmark (sync)
        # No --strict-gate here yet: the zero-error claim is measured for the
        # 64-case push slice, not for this 194-case run (the last full matrices
        # on this project's own box logged environment FNs).  Tighten once a
        # full both-engines run has actually passed clean.
        run: python -m benchmark.runner
      - name: Full benchmark (async)
        run: python -m benchmark.runner --engine async
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark/results/*.json

  nightly-gate:
    # The full file-by-file suite: same entry point as the local gate
    # (tests/run_all_batched.py), so CI sees per-file timeouts, one retry,
    # and evidence logs that survive the run -- not one wedged pytest
    # process killed by the job ceiling.
    # Since 2026-11-04 this job is the SOLE owner of the full gate on
    # schedule / workflow_dispatch; `tests` steps aside there (see its if).
    # The 150-min ceiling (vs 60 in `tests`) is why it owns the slow run:
    # the local sequential gate has measured 4554s (~76 min).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          # requirements.txt is the declared environment
          # (`-e .[dev,async,ast,api]`); installing less here meant the
          # AST-channel and flask-path tests self-skipped in the very job
          # that claims to run "the same entry point the author's machine
          # gates on".  nuclei is added for the same reason (2026-10-29:
          # the whole test_nuclei_import file skipped for want of pyyaml).
          pip install -e ".[dev,async,ast,api,nuclei]"
          # 2026-11-01: nightly failed three schedule runs in a row at the
          # gate step while the push `tests` job (SAME run_all_batched.py
          # entry) stayed green in the same run -- the only install delta
          # was cryptography/playwright/chromium.  Align with the tests
          # job: a gate that runs with fewer deps than the entry point
          # promises measures a different suite. (The specific red file is
          # not yet identified -- job logs need auth to fetch; the next
          # scheduled run confirms.)
          pip install cryptography playwright
          python -m playwright install chromium --with-deps
      - name: Full file-by-file test gate
        run: python tests/run_all_batched.py --quiet
      - name: Evidence-shape sweep (Phase 312, all routes both engines)
        run: python benchmark/evidence_shape_sweep.py
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regression-logs
          path: benchmark/results/regression_logs/
          if-no-files-found: ignore

  dependency-audit:
    # Supply-chain measurement (Phase 328c). Was REPORT-ONLY until the
    # fixed versions were verified under the declared floors -- see
    # docs/DEPENDENCY_AUDIT.md: fresh-install audits report 0 advisories
    # (2026-10-26 / 2026-11-01) and the main job is green on 3.10/3.11
    # with the floors, so the documented flip condition is met and the
    # step is blocking since 2026-11-01 (with one transport retry).
    # 2026-11-04: the blocking gate caught its first real finding (the
    # runner's setuptools 79.0.1); see DEPENDENCY_AUDIT.md "2026-11-04".
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,async,ast,api]"
          pip install pip-audit
          # 2026-11-04: ubuntu-latest ships setuptools 79.0.1, which
          # pip-audit (whole-environment scope) flagged in run 41817920644
          # (CVE-2026-59890 / GHSA-xmj3-9gf7-h52w).  Keep this LAST so the
          # audit sees the final environment.  Upgrade the toolchain instead
          # of excluding it: an ignore-list would hide the next real finding.
          pip install -U "setuptools>=84.1.0"
      - name: Audit installed dependencies
        # 2026-11-01: flip condition in docs/DEPENDENCY_AUDIT.md ("only
        # after the main CI job passes on 3.10/3.11 with these floors") is
        # met -- pushes green on 3.10 min-python + 3.11 main since Phase
        # 328d (runs 1073ec4 / 2a74478 / 14d0c5d / fad3830 / 793535b), and
        # fresh-install pip-audit reports 0 advisories (2026-10-26 and
        # 2026-11-01 re-run).  The retry tolerates OSV transport blips; a
        # real advisory fails both attempts and stays red.
        run: python -m pip_audit --format json -o pip-audit.json || python -m pip_audit --format json -o pip-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-audit
          path: pip-audit.json
          if-no-files-found: ignore

  windows-smoke:
    # 2026-11-01 (release-readiness gap audit): the dev box is Windows and this
    # repo documents Windows-specific pathologies (mandatory integrity labels vs
    # Playwright tempdirs, SO_REUSEADDR port shadowing, loopback throttling),
    # yet every CI job ran on ubuntu only -- the pyproject classifier claims
    # "OS Independent" with no Windows evidence. This smoke job pins the
    # platform floor: CLI construction plus the static/architecture gates that
    # need no loopback. Deliberately NOT the network-heavy suites -- those stay
    # on Linux where the loopback gate is calibrated.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (dev toolchain; core engine only -- no headless/network suites here)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: CLI smoke (arg parsing + entry points construct on Windows)
        run: |
          python -m xssentinel --help
          python -m xssentinel selftest --help
      - name: Platform-independent gates (no loopback required)
        run: pytest tests/test_architecture_scale.py tests/test_quick_gate_slice.py tests/test_silent_except_ratchet.py tests/test_doc_code_counts.py tests/test_cli_subcommands.py -q --timeout=240
